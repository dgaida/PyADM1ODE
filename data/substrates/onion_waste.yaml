# Substrate definition: Onion waste
#
# Measured parameters (schema "measured"): names and units as in the
# substrate user guide. Carbohydrates are split by the cell wall (NDF, ADL);
# the inert share (D_VS) is fitted to the methane potential BMP.
#
# Values: dry-matter composition from the Phyllis database (phyllis.nl,
# median of the samples named per line) where it holds the material;
# methane potential from the standard yields of the BiomasseV 2012; storage
# state (pH, ammonium, acids, buffer, temperature) from published analyses
# of the material as it is fed; price from the superseded file in legacy/.
# The source of every value stands behind it. Derivation: substrate user
# guide, section "Origin of the library values".
#
# Phyllis holds onion peel (#3068) and ash analyses of onions only.
# Composition of the whole onion from the USDA food database; fresh bulbs
# carry neither ammonium nor fermentation acids.

name: Onion waste
schema: measured

# --- Classification ----------------------------------------------------
substrate_class: "Gemüse (aussortiert) (EK 0)" # [BiomasseV 2012]

# --- Dry matter --------------------------------------------------------
TS:              10.89      # % FM [USDA FoodData Central] onions, raw, 100 - water
VS:              96.79      # % TS [USDA FoodData Central] onions, raw, 100 - ash

# --- Weender analysis --------------------------------------------------
RP:              10.1       # % TS [USDA FoodData Central] onions, raw
RL:              0.92       # % TS [USDA FoodData Central] onions, raw

# --- Cell wall (van Soest) ---------------------------------------------
NDF:             15.61      # % TS [USDA FoodData Central] onions, raw, total dietary fibre as cell wall
ADL:             0.0        # % TS [assumption] not measured; the inert share follows from BMP

# --- Degradability -----------------------------------------------------
BMP:             379.0      # Nm³ CH4/t VS [BiomasseV 2012] 40 m³ CH4/t FM, referred to the substrate itself (10.89 % TS, 96.79 % VS)

# --- Storage state -----------------------------------------------------
pH:              5.5        # - [FDA pH of foods] raw onions 5.30-5.85 (red, white, yellow)
NH4:             0.0        # kg N/m³ [assumption] fresh plant tissue; no ammonium reported for onion waste
KS43:            0.0        # mol/m³ [assumption] no bicarbonate reported for onion waste
FFS:             0.0        # kg HAc/m³ [FDA pH of foods] fresh bulbs are not acid-fermented (pickled onions reach pH 3.7-4.6); no VFA reported for fresh onion waste
Temp:            9.3        # °C [DWD 1991-2020] mean air temperature of Germany 1991-2020; stored outdoors

# --- Economics ---------------------------------------------------------
cost:            5.0        # EUR/t FM [previous file]
