# Substrate definition: Cereal whole-plant silage (GPS)
#
# Measured parameters (schema "measured"): names and units as in the
# substrate user guide. Carbohydrates are split by the cell wall (NDF, ADL);
# the inert share (D_VS) is fitted to the methane potential BMP.
#
# Values: dry-matter composition from the Phyllis database (phyllis.nl,
# median of the samples named per line) where it holds the material;
# methane potential from the standard yields of the BiomasseV 2012; storage
# state (pH, ammonium, acids, buffer, temperature) from published analyses
# of the material as it is fed; price from the superseded file in legacy/.
# The source of every value stands behind it. Derivation: substrate user
# guide, section "Origin of the library values".
#
# Fermentation quality (Leisen 2011): mean of 20 cereal whole-crop silages
# (LUFA NRW, 1999-2010).
#
# Wheat is the only whole-crop cereal in Phyllis. The dry-matter composition
# is therefore the one of wheat_whole_plant_silage; the two files differ in
# lipids and price only.

name: Cereal whole-plant silage (GPS)
schema: measured

# --- Classification ----------------------------------------------------
substrate_class: "Getreide (GPS) (EK I)" # [BiomasseV 2012]

# --- Dry matter --------------------------------------------------------
TS:              36.8       # % FM [Phyllis] 100 - moisture, median of n=6, range 35.7-39.5 (#2648, #2649, #2650, #2651, #2652, #2653)
VS:              93.3       # % TS [Phyllis] 100 - ash, median of n=6, range 90.3-93.7 (#2648, #2649, #2650, #2651, #2652, #2653)

# --- Weender analysis --------------------------------------------------
RP:              6.45       # % TS [Phyllis] protein measured, median of n=6, range 5.6-7.3 (#2648, #2649, #2650, #2651, #2652, #2653)
RL:              0.8        # % TS [previous file] no lipid value in Phyllis

# --- Cell wall (van Soest) ---------------------------------------------
NDF:             53.8       # % TS [Phyllis] cellulose + hemicellulose + lignin, median of n=6, range 44.3-57 (#2648, #2649, #2650, #2651, #2652, #2653)
ADF:             37.5       # % TS [Phyllis] cellulose + lignin, median of n=6, range 27.7-41.2 (#2648, #2649, #2650, #2651, #2652, #2653)
ADL:             9.55       # % TS [Phyllis] lignin, median of n=6, range 7.5-10.2 (#2648, #2649, #2650, #2651, #2652, #2653)

# --- Degradability -----------------------------------------------------
BMP:             329.0      # Nm³ CH4/t VS [BiomasseV 2012] 103 m³ CH4/t FM, KTBL standard dry matter 33 % TS, 95 % VS

# --- Storage state -----------------------------------------------------
pH:              4.0        # - [Leisen 2011]
NH4:             0.384      # kg N/m³ [Leisen 2011] NH3-N 10.1 % of the total N; N = RP/6.25, per kg FM with TS
KS43:            0.0        # mol/m³ [definition] no bicarbonate in a silage; the buffer is the lactic/acetic acid system
Sac:             6.99       # g/l [Leisen 2011] acetic acid 19 g/kg TS, per kg FM with TS
Spro:            0.0        # g/l [Kung & Shaver] not reported separately; below 1 g/kg TS in silages
Sbu:             0.44       # g/l [Leisen 2011] butyric acid 1.2 g/kg TS, per kg FM with TS
Sva:             0.0        # g/l [Leisen 2011] not reported for silages; below detection
Temp:            9.3        # °C [DWD 1991-2020] mean air temperature of Germany 1991-2020; stored outdoors (silage clamp)

# --- Economics ---------------------------------------------------------
cost:            36.0       # EUR/t FM [previous file]
