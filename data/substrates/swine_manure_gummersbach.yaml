# Substrate definition: Swine manure (Gummersbach plant)
#
# Measured parameters (schema "measured"): names and units as in the
# substrate user guide. Carbohydrates are split by the crude fibre (RF, fOTSrf);
# the inert share (aXI) is fitted to the methane potential BMP.
#
# Values: dry-matter composition from the Phyllis database (phyllis.nl,
# median of the samples named per line) where it holds the material;
# methane potential from the standard yields of the BiomasseV 2012; storage
# state (pH, ammonium, acids, buffer, temperature) from published analyses
# of the material as it is fed; price from the superseded file in legacy/.
# The source of every value stands behind it. Derivation: substrate user
# guide, section "Origin of the library values".
#
# Plant-specific file, laboratory values of the plant kept. The degradation
# level 0.95 of the library had no source and is replaced by the standard
# methane yield. The acid capacity is now read as the titration value it is:
# the acid anions titrated along are subtracted from the bicarbonate.

name: Swine manure (Gummersbach plant)
schema: measured

# --- Classification ----------------------------------------------------
substrate_class: "Schweinegülle (EK II)" # [Gummersbach library]

# --- Dry matter --------------------------------------------------------
TS:              6.1        # % FM [Gummersbach library] plant measurement, entry 'swinemanure'
VS:              71.6       # % TS [Gummersbach library] plant measurement, entry 'swinemanure'

# --- Weender analysis --------------------------------------------------
RP:              16.31      # % TS [Gummersbach library] plant measurement, entry 'swinemanure'
RL:              4.55       # % TS [Gummersbach library] plant measurement, entry 'swinemanure'
RF:              11.35      # % TS [Gummersbach library] plant measurement, entry 'swinemanure'

# --- Degradability -----------------------------------------------------
BMP:             250.0      # Nm³ CH4/t VS [BiomasseV 2012] 12 m³ CH4/t FM, KTBL standard dry matter 6 % TS, 80 % VS
fOTSrf:          0.722      # - [previous file] degradable share of the crude fibre
aSi:             0.05       # - [previous file] soluble inert share

# --- Storage state -----------------------------------------------------
pH:              7.1        # - [Gummersbach library] entry 'swinemanure'
Snh4:            4.0        # g/l [Gummersbach library] entry 'swinemanure', ammonium as NH4
TAC:             212.22     # mmol/l [Gummersbach library] entry 'swinemanure', titrated acid capacity to pH 4.3
Sac:             12.43      # g/l [Gummersbach library] entry 'swinemanure'
Spro:            0.8        # g/l [Gummersbach library] entry 'swinemanure'
Sbu:             0.0        # g/l [Gummersbach library] entry 'swinemanure'
Sva:             0.0        # g/l [Gummersbach library] entry 'swinemanure'
T:               16.37      # °C [Gummersbach library] entry 'swinemanure'

# --- Economics ---------------------------------------------------------
cost:            2.0        # EUR/t FM [previous file]
